      - name: Export Web
        run: mkdir -p build/web && ~/.local/godot/godot --headless --path . --export-release "Web" build/web/index.html
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/
          if-no-files-found: error

  # ============ HarmonyOS: godot-ohos 插件 + OHOS SDK (实验性, 允许失败) ============
  harmony:
    name: HarmonyOS (HAP, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
          cd ~/.local/godot
          if [ ! -f godot ]; then
            curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          fi
          chmod +x godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            curl -sL -o /tmp/tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Install OHOS SDK
        id: ohos
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
      - name: Install godot-ohos plugin (自带 OHOS 导出模板)
        run: |
          curl -sL -o /tmp/ohos.zip "https://github.com/godothub/godot-ohos/releases/download/4.7/godot-ohos.zip"
          unzip -o -q /tmp/ohos.zip -d /tmp/ohos_plugin
          mkdir -p addons
          if [ -d /tmp/ohos_plugin/godot-ohos ]; then
            cp -r /tmp/ohos_plugin/godot-ohos addons/
          else
            cp -r /tmp/ohos_plugin addons/godot-ohos
          fi
          ls -R addons/godot-ohos | head -20
      - name: Enable plugin in project.godot
        run: |
          grep -q "godot-ohos" project.godot || \
            sed -i 's|\[application\]|[editor_plugins]\nenabled=PackedStringArray("res://addons/godot-ohos/plugin.cfg")\n\n[application]|' project.godot
          grep -A1 "editor_plugins" project.godot
      - name: Export HarmonyOS HAP
        run: |
          # Deveco/SDK 路径由 setup-ohos-sdk 提供; 插件导出预设走 "HarmonyOS"
          export OHOS_SDK="${{ steps.ohos.outputs.ohos_sdk_root }}"
          ~/.local/godot/godot --headless --path . --import 2>&1 | grep -E "ERROR" || true
          mkdir -p build/harmony && ~/.local/godot/godot --headless --path . --export-release "OpenHarmony" build/harmony/ZombieRaid.hap
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony
          path: build/harmony/
          if-no-files-found: error

  # ============ 发布: 全绿后逐平台 zip → GitHub Release ============
  release:
    name: Publish GitHub Release
    needs: [windows-x64, windows-arm64, linux-x64, linux-arm64, macos, android, ios, web, harmony]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            exit 0
          fi
          mkdir -p release_assets
          for d in dist/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/release_assets/ZombieRaid-${name}.zip" .) || true
          done
          ls -la release_assets
          {
            echo "## Zombie Raid v${VERSION} — 平台产物"
            echo "- Windows: x64 / arm64 (.exe)"
            echo "- Linux: x86_64 / aarch64 (ELF, 内嵌资源)"
            echo "- macOS: universal x64+arm64 (.zip 内 .app, 未签名 — 首次打开需 xattr -cr)"
            echo "- Android: arm64 APK (CI 临时 keystore 签名, 可直接安装)"
            echo "- iOS: arm64 未签名 .ipa (需自签后侧载)"
            echo "- Web: WASM (解压后本地起静态服务即可玩, 鸿蒙浏览器亦支持)"
            echo "- HarmonyOS: HAP (实验性, godot-ohos 插件导出)"
            echo ""
            echo "操作: WASD 移动 / 左键射击 / R 换弹 / Shift 疾跑 / C 下蹲 / Q·E 侧倾 / V 切视角 / T 手电筒"
          } > notes.md
          gh release create "$TAG" release_assets/*.zip \
            --title "Zombie Raid v${VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
