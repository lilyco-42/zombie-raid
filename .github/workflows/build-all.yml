            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import assets
        run: ~/.local/godot/godot --headless --path . --import 2>&1 | grep -E "ERROR" || true
      - name: Export macOS (unsigned zip)
        run: mkdir -p build/macos && ~/.local/godot/godot --headless --path . --export-release "macOS" build/macos/ZombieRaid-macOS.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/
          if-no-files-found: error

  # ============ Android: 临时 keystore 签名, 纯模板打包(免 gradle) ============
  android:
    name: Android arm64 (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
          cd ~/.local/godot
          if [ ! -f godot ]; then
            curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          fi
          chmod +x godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            curl -sL -o /tmp/tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Generate CI keystore (throwaway, 不是正式签名)
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ci-release.keystore" \
            -alias zombieraid -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zombieraid -keypass zombieraid \
            -dname "CN=Zombie Raid, O=lilyco, C=CN"
      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci-release.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: zombieraid
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: zombieraid
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/ci-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: zombieraid
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: zombieraid
        run: mkdir -p build/android && ~/.local/godot/godot --headless --path . --export-release "Android" build/android/ZombieRaid.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/
          if-no-files-found: error

  # ============ iOS: 未签名 ipa(下载后需自行签名/侧载) ============
