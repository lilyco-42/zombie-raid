          path: build/ios/
          if-no-files-found: error

  # ============ Web / WASM: 鸿蒙浏览器也能直接跑 ============
  web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
