name: Build All Platforms

# Godot 全平台导出矩阵(移植自 cute-pet 的 13-job 模式, 见该仓库 docs/CI_BUILD.md):
#   Windows(x64/arm64) · Linux(x64/arm64) · macOS(universal) · Android(arm64)
#   · iOS(未签名 ipa) · Web(WASM, 鸿蒙浏览器可直接跑) · HarmonyOS(HAP, godot-ohos)
#
# 约定(踩坑教训):
#   - 每个 job 自己装 Godot + 模板(版本锁 4.7.2, 带缓存), 全部在 ubuntu 交叉导出
#   - upload-artifact 的 path 相对仓库根(不要被 defaults/run 的 working-directory 骗)
#   - artifact 目录名 = 平台名, release job 逐目录打包 zip(避免同名冲突)
#   - 不要用 YAML anchor, GitHub 解析器对它支持不稳

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  # ============ 桌面三兄弟: Windows x2 / Linux x2 / macOS ============
  windows-x64:
    name: Windows x64
    runs-on: ubuntu-latest
    steps: &godot_export_steps
      - uses: actions/checkout@v4
      - name: Cache Godot engine + export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
          cd ~/.local/godot
          if [ ! -f godot ]; then
            curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          fi
          chmod +x godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            curl -sL -o /tmp/tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import assets
        run: ~/.local/godot/godot --headless --path . --import 2>&1 | grep -E "ERROR" || true
      - name: Export Windows x64
        run: mkdir -p build/windows-x64 && ~/.local/godot/godot --headless --path . --export-release "Windows x64" build/windows-x64/ZombieRaid.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/windows-x64/
          if-no-files-found: error

  windows-arm64:
    name: Windows arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
          cd ~/.local/godot
          if [ ! -f godot ]; then
            curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          fi
          chmod +x godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            curl -sL -o /tmp/tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import assets
        run: ~/.local/godot/godot --headless --path . --import 2>&1 | grep -E "ERROR" || true
      - name: Export Windows arm64
        run: mkdir -p build/windows-arm64 && ~/.local/godot/godot --headless --path . --export-release "Windows arm64" build/windows-arm64/ZombieRaid.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: build/windows-arm64/
          if-no-files-found: error

  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
          cd ~/.local/godot
          if [ ! -f godot ]; then
            curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          fi
          chmod +x godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            curl -sL -o /tmp/tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import assets
        run: ~/.local/godot/godot --headless --path . --import 2>&1 | grep -E "ERROR" || true
      - name: Export Linux x86_64
        run: mkdir -p build/linux-x64 && ~/.local/godot/godot --headless --path . --export-release "Linux x86_64" build/linux-x64/ZombieRaid.x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/linux-x64/
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
          cd ~/.local/godot
          if [ ! -f godot ]; then
            curl -sL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -o -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          fi
          chmod +x godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
