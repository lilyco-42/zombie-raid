            unzip -o -q /tmp/tpz -d /tmp
            mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import assets
        run: ~/.local/godot/godot --headless --path . --import 2>&1 | grep -E "ERROR" || true
      - name: Export Linux arm64
        run: mkdir -p build/linux-arm64 && ~/.local/godot/godot --headless --path . --export-release "Linux arm64" build/linux-arm64/ZombieRaid.aarch64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: build/linux-arm64/
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/.local/godot ~/.local/share/godot/export_templates
